<!doctype html>
<meta charset="utf-8" />
<style>
  body { font: 13px/1.45 system-ui, -apple-system, sans-serif; width: 260px; margin: 0; padding: 14px; color: #222; }
  h1 { font-size: 14px; margin: 0 0 4px; }
  .sub { color: #888; font-size: 11px; margin: 0 0 10px; }
  #list { margin-bottom: 4px; }
  .use { display: block; width: 100%; text-align: left; padding: 8px 10px; margin: 4px 0; border: 1px solid #ddd; background: #fafafa; border-radius: 5px; cursor: pointer; font: inherit; }
  .use:hover { border-color: #ff5722; background: #fff3ee; }
  .use.active { border-color: #ff5722; background: #fff3ee; font-weight: 600; }
  hr { border: 0; border-top: 1px solid #eee; margin: 12px 0; }
  .head { font-weight: 600; }
  button.primary { width: 100%; padding: 8px; border: 0; border-radius: 5px; cursor: pointer; font-weight: 600; }
  #sync { background: #eef; color: #224; margin-top: 6px; }
  #syncStatus { font-size: 11px; margin: 4px 0 0; }
  .ok { color: #1b7f2e; }
  .err { color: #c62828; }
  .muted { color: #999; font-size: 11px; margin-top: 10px; }
</style>

<h1>Zerodha Kite Auto-Login</h1>
<p class="sub">Attach THIS browser to an account — it logs in as that account from then on.</p>

<div id="list"></div>

<hr />
<div class="head">Oracle server sync</div>
<p class="sub" style="margin: 2px 0 0">Sent automatically after every Kite login.</p>
<p id="syncStatus" class="muted">—</p>
<button id="sync" class="primary">Sync enctoken now</button>

<p class="muted">
  Accounts come from <code>config.js</code>. The choice is stored in this browser
  profile only, so each browser keeps its own account.
</p>

<script src="config.js"></script>
<script src="popup.js"></script>
